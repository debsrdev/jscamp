<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJobs - Resultados de búsqueda</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module">
        import React from 'https://esm.sh/react?dev';
        import ReactDOM from 'https://esm.sh/react-dom/client?dev';

        window.React = React
        window.ReactDOM = ReactDOM

    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

    /*  const titulo = React.createElement(
            'h1',
            { style : { color: '#4A90E2', fontSize: '1.5rem' } },
            'Hola React.js!'
        ) */

        // Elemento de React usando JSX
        const titulo = <h1 style={{color: "#4A90E2"}}>Hola React.js!</h1>;
        
        // Componente de React usando función
        function Titulo({nombre, color}) {
            return <p style={{color: color}}>Hola {nombre} desde un Componente de React!</p>;
        }

        // Componente de tarjeta de trabajo
        function JobCard({data, titulo, empresa, ubicacion, descripcion}) {
            const [applied, setApplied] = React.useState(false);

            function handleClick() {
                setApplied(!applied);
            }

            const buttonText = applied ? "Aplicado" : "Aplicar";
            const buttonClass = applied ? "is-applied" : "";

            return (
                <article className="job-card"
                    data-modalidad={data?.modalidad}
                    data-nivel={data?.nivel}
                    data-technology={data?.technology}
                >
                    <div>
                        <h3>{titulo}</h3>
                        <div><p>{empresa}</p> | <p>{ubicacion}</p></div>
                        <p>{descripcion}</p>
                    </div>
                    <button 
                        // disabled={applied}
                        className={`button-apply-job ${buttonClass}`}
                        onClick={handleClick}>{buttonText}</button>
                </article>
            );
        }

        function App() {
            return (
                <div className="job-results">
                    <JobCard 
                        titulo="Desarrollador Frontend React.js" 
                        empresa="Tech Solutions" 
                        ubicacion="Remoto" 
                        descripcion="Únete a nuestro equipo como Desarrollador Frontend especializado en React.js. Trabaja en proyectos innovadores y colabora con un equipo dinámico."
                        data={{modalidad: 'remoto', nivel: 'mid-level', technology: 'frontend'}}
                    />
                </div>
            );
        }

        const rootElement = document.querySelector('#react-root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</head>
<body>
    <header>
        <h1>      
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        <section>

    </main>

</body>
